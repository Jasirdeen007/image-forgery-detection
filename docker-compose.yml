services:
  document-forgery-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Host port 8001 avoids the existing NetBox service on host port 8000.
      - "8001:8000"
    environment:
      MODEL_CHECKPOINT: /app/artifacts/efficientnet_b3_finetuned.pt
      FORGERY_THRESHOLD: "0.5"
      MAX_UPLOAD_BYTES: "10485760"
    volumes:
      - ./artifacts:/app/artifacts:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 30s
      timeout: 10s
      retries: 3
